<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL V6.2 - CORE RESTORED</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --neon: #00f2ff; --panic: #ff003c; --bg: #010203; }
        body, html, #root { height: 100%; margin: 0; background: var(--bg); overflow: hidden; color: var(--neon); font-family: 'Share Tech Mono', monospace; }
        
        /* EL MAPA TÁCTICO DE VERDAD */
        #map { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;
            /* El filtro secreto para el look Cyberpunk */
            filter: invert(100%) hue-rotate(185deg) brightness(0.4) contrast(1.4) saturate(1.5);
            background: #000 !important;
        }

        /* HUD - PANELES FLOTANTES ESTILO CORE CONTROL */
        .hud-overlay {
            position: absolute; inset: 0; z-index: 100; pointer-events: none;
            padding: 25px; display: flex; flex-direction: column; justify-content: justify-between;
        }

        .cyber-card {
            pointer-events: auto;
            background: rgba(0, 15, 20, 0.75);
            border: 1px solid var(--neon);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1), inset 0 0 20px rgba(0, 242, 255, 0.05);
            backdrop-filter: blur(8px);
            position: relative;
        }

        .cyber-card::before {
            content: ""; position: absolute; top: -2px; left: 10%; width: 80%; height: 1px; background: var(--neon); box-shadow: 0 0 10px var(--neon);
        }

        .panic-active {
            animation: panic-flash 0.5s infinite;
            border: 2px solid var(--panic) !important;
            box-shadow: 0 0 30px var(--panic) !important;
        }

        @keyframes panic-flash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* Iconos de Unidades */
        .unit-marker { background: var(--neon); border: 2px solid white; border-radius: 50%; box-shadow: 0 0 10px var(--neon); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZbiujhcbiugrkhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        const WarRoom = () => {
            const [units, setUnits] = useState([]);
            const [activePanic, setActivePanic] = useState(null);
            const mapRef = useRef(null);
            const markersRef = useRef({});
            const remoteVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false, attributionControl: false }).setView([-38.0055, -57.5426], 14);
                    // Usamos un tile layer que funcione bien con el filtro
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapRef.current);
                    setTimeout(() => mapRef.current.invalidateSize(), 500);
                }

                const peer = new Peer('WAR_ROOM_CENTRAL');
                peer.on('call', call => {
                    call.answer();
                    call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                });
                peerRef.current = peer;

                // Sincronización de unidades y mapa
                const timer = setInterval(async () => {
                    const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
                    if (data) {
                        setUnits(data);
                        data.forEach(u => {
                            if (u.lat && u.lng) {
                                if (!markersRef.current[u.id]) {
                                    markersRef.current[u.id] = L.circleMarker([u.lat, u.lng], {
                                        radius: 6, color: '#fff', fillColor: '#00f2ff', fillOpacity: 1, weight: 2
                                    }).addTo(mapRef.current);
                                } else {
                                    markersRef.current[u.id].setLatLng([u.lat, u.lng]);
                                }
                            }
                        });
                    }
                }, 3000);

                return () => { clearInterval(timer); peer.destroy(); };
            }, []);

            return (
                <div className="relative h-full w-full bg-black">
                    <div id="map"></div>

                    <div className="hud-overlay flex justify-between items-start">
                        {/* HEADER */}
                        <div className="absolute top-6 left-1/2 -translate-x-1/2 z-[200]">
                            <h1 className="text-2xl font-black italic tracking-[1em] text-cyan-400 drop-shadow-lg">CORE CONTROL CENTER</h1>
                            <div className="h-[2px] bg-cyan-500 w-full animate-pulse mt-1"></div>
                        </div>

                        {/* LEFT: RED OPERATIVA */}
                        <div className="cyber-card w-72 h-[60%] mt-20 p-4">
                            <h2 className="text-[10px] tracking-widest text-white/50 mb-4 uppercase">System_Nodes // Real-Time</h2>
                            <div className="space-y-3">
                                {units.map(u => (
                                    <div key={u.id} className="border-l-2 border-cyan-500 bg-cyan-950/20 p-2 flex justify-between items-center">
                                        <div className="flex flex-col">
                                            <span className="text-[11px] font-bold">{u.unit_name}</span>
                                            <span className="text-[8px] opacity-40">LAT: {u.lat?.toFixed(3)} | LNG: {u.lng?.toFixed(3)}</span>
                                        </div>
                                        <div className="w-2 h-2 bg-cyan-500 rounded-full shadow-[0_0_5px_cyan]"></div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* RIGHT: VIDEO & DIAGNOSTICS */}
                        <div className="flex flex-col gap-4 mt-20">
                            <div className={`cyber-card w-96 aspect-video overflow-hidden ${activePanic ? 'panic-active' : ''}`}>
                                <video ref={remoteVideo} autoPlay playsInline className="w-full h-full object-cover grayscale contrast-150" />
                                <div className="absolute top-2 right-2 flex gap-2">
                                    <span className="text-[8px] bg-red-600 px-1 text-white animate-pulse">REC</span>
                                    <span className="text-[8px] bg-black/80 px-1">CAM_01</span>
                                </div>
                                {!remoteVideo.current?.srcObject && (
                                    <div className="absolute inset-0 flex items-center justify-center text-[10px] opacity-20">NO_SIGNAL_CONNECTED</div>
                                )}
                            </div>

                            <div className="cyber-card w-96 p-4">
                                <h3 className="text-[9px] mb-2 underline opacity-50">Mission_Log</h3>
                                <div className="text-[10px] space-y-1 font-mono">
                                    <p className="text-cyan-400">> TRÁFICO: NORMAL</p>
                                    <p className="text-cyan-400">> NODOS ACTIVOS: {units.length}</p>
                                    <p className="text-cyan-400">> SISTEMA: OPERATIVO</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* BARRA INFERIOR */}
                    <div className="absolute bottom-6 left-6 z-[200] cyber-card p-2 px-6">
                        <span className="text-[10px] tracking-widest">MAR DEL PLATA VIVA // SECTOR_CENTRO</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const isPC = !/iPhone|Android|iPad/i.test(navigator.userAgent);
            return isPC ? <WarRoom /> : <div className="p-10 text-center">MODO UNIDAD: USE EL CÓDIGO ANTERIOR</div>;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
