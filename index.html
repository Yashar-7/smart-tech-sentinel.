<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V4.4 - UNLOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --neon-cyan: #00f2ff; --dark-bg: #050508; }
        body { margin: 0; background: var(--dark-bg); color: var(--neon-cyan); font-family: 'monospace'; overflow-x: hidden; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const WarRoom = () => {
            const [myId, setMyId] = useState('');
            const [remoteId, setRemoteId] = useState('');
            const [isStreaming, setIsStreaming] = useState(false);
            const myVideo = useRef(null);
            const remoteVideo = useRef(null);
            const peer = useRef(null);

            useEffect(() => {
                peer.current = new Peer();
                peer.current.on('open', id => setMyId(id));
                peer.current.on('call', call => {
                    call.answer(myVideo.current?.srcObject);
                    call.on('stream', stream => {
                        remoteVideo.current.srcObject = stream;
                    });
                });
            }, []);

            const startCam = async () => {
                try {
                    // Configuración simplificada para máxima compatibilidad
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    myVideo.current.srcObject = stream;
                    setIsStreaming(true);
                } catch (e) { alert("Error cámara: " + e.message); }
            };

            const connect = () => {
                // Quitamos la restricción de "Primero debes iniciar..."
                const call = peer.current.call(remoteId, myVideo.current?.srcObject);
                call.on('stream', stream => {
                    remoteVideo.current.srcObject = stream;
                });
            };

            return (
                <div className="p-4 bg-black min-h-screen text-cyan-400">
                    <h1 className="text-xl font-bold mb-4 border-b border-cyan-900">SENTINEL V4.4</h1>
                    <p className="text-[10px] mb-4 text-green-500">MI ID: {myId}</p>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                        {/* PANEL CONTROL */}
                        <div className="border border-yellow-600 p-2 bg-yellow-950/10">
                            <input 
                                className="bg-black border border-yellow-600 p-1 text-xs w-full mb-2"
                                placeholder="PEGAR ID AQUÍ..."
                                onChange={e => setRemoteId(e.target.value)}
                            />
                            <button onClick={connect} className="bg-yellow-600 text-black text-xs font-bold px-4 py-1 w-full">ENLAZAR SEÑAL</button>
                        </div>

                        {/* MI CÁMARA */}
                        <div className="border border-cyan-900 p-2">
                            <video ref={myVideo} autoPlay playsInline muted className="w-full aspect-video bg-gray-900 mb-2" />
                            {!isStreaming && <button onClick={startCam} className="bg-cyan-600 text-black text-xs font-bold px-4 py-1 w-full">ACTIVAR MI CÁMARA</button>}
                        </div>

                        {/* CÁMARA REMOTA (ALMACÉN) */}
                        <div className="border border-red-900 p-2 col-span-1 lg:col-span-2">
                            <p className="text-[10px] text-red-500 mb-1">● SEÑAL REMOTA</p>
                            <video ref={remoteVideo} autoPlay playsInline muted className="w-full max-h-[400px] bg-gray-950" />
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<WarRoom />);
    </script>
</body>
</html>
