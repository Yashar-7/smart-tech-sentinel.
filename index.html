<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V4.9 - CENTRAL MONITOR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-cyan: #00f2ff; --dark-bg: #050508; }
        body { margin: 0; background: var(--dark-bg); color: var(--neon-cyan); font-family: 'monospace'; }
        .monitor-frame { border: 1px solid #1e293b; position: relative; }
        .scanline { width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1); position: absolute; top: 0; animation: scan 4s linear infinite; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const WarRoom = () => {
            const [myId, setMyId] = useState('');
            const [units, setUnits] = useState([]);
            const [isPC, setIsPC] = useState(false);
            const myVideo = useRef(null);
            const remoteVideo = useRef(null);
            const peerInstance = useRef(null);

            useEffect(() => {
                const device = !/iPhone|Android|iPad/i.test(navigator.userAgent);
                setIsPC(device);

                const init = async () => {
                    // 1. Activar cámara siempre para emitir
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: isPC ? "user" : "environment" }, 
                        audio: false 
                    });
                    if (myVideo.current) myVideo.current.srcObject = stream;

                    const peer = new Peer({
                        config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]}
                    });

                    peer.on('open', async (id) => {
                        setMyId(id);
                        await supabaseClient.from('sentinel_units').upsert({ 
                            unit_name: device ? "CENTRAL_WAR_ROOM" : `MOVIL_${id.substring(0,4)}`, 
                            peer_id: id,
                            is_online: true 
                        });
                    });

                    // 2. RECIBIR LLAMADA (Solo la central procesa el video entrante)
                    peer.on('call', call => {
                        // Respondemos pero NO enviamos nuestro video (stream: null o vacio)
                        call.answer(); 
                        call.on('stream', remoteStream => {
                            if (device && remoteVideo.current) {
                                remoteVideo.current.srcObject = remoteStream;
                            }
                        });
                    });

                    peerInstance.current = peer;
                };

                init();
                const interval = setInterval(fetchUnits, 3000);
                return () => clearInterval(interval);
            }, [isPC]);

            const fetchUnits = async () => {
                const { data } = await supabaseClient.from('sentinel_units').select('*').eq('is_online', true);
                setUnits(data || []);
            };

            const connectTo = (remoteId) => {
                // La central llama pidiendo el video de la unidad
                const call = peerInstance.current.call(remoteId, myVideo.current.srcObject);
                call.on('stream', stream => {
                    if (remoteVideo.current) remoteVideo.current.srcObject = stream;
                });
            };

            return (
                <div className="p-4 bg-black min-h-screen text-cyan-400 font-mono">
                    <div className="flex justify-between border-b border-cyan-900 mb-6 pb-2">
                        <h1 className="text-xl font-bold tracking-widest text-white">SENTINEL <span className="text-cyan-500 font-light">V4.9</span></h1>
                        <div className="text-right">
                            <span className="block text-[10px] text-green-500">SISTEMA ENCRIPTADO</span>
                            <span className="text-[8px] text-gray-500">ID_NODE: {myId}</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        {/* LISTA DE UNIDADES - Solo visible en PC */}
                        {isPC && (
                            <div className="lg:col-span-3 space-y-4">
                                <div className="border border-cyan-900 p-3 bg-cyan-950/10">
                                    <p className="text-[10px] font-bold text-white mb-4 uppercase underline">Unidades Operativas</p>
                                    <div className="space-y-2">
                                        {units.filter(u => u.unit_name.includes("MOVIL")).map(u => (
                                            <button key={u.id} onClick={() => connectTo(u.peer_id)} className="w-full text-left border border-cyan-500/30 p-2 text-[10px] hover:bg-cyan-500 hover:text-black transition-all flex justify-between items-center">
                                                <span>📡 {u.unit_name}</span>
                                                <span className="text-[8px] animate-pulse">● RECIBIR</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* VISOR PRINCIPAL (Solo Central) o PREVIEW (Móvil) */}
                        <div className={`${isPC ? 'lg:col-span-6' : 'lg:col-span-12'} monitor-frame bg-gray-950 min-h-[300px]`}>
                            <div className="scanline"></div>
                            {isPC ? (
                                <video ref={remoteVideo} autoPlay playsInline className="w-full aspect-video object-cover" />
                            ) : (
                                <div className="flex items-center justify-center h-full text-[10px] text-cyan-800 text-center p-10">
                                    MODO EMISOR ACTIVO<br/>TRANSMITIENDO A CENTRAL...
                                </div>
                            )}
                            <div className="absolute bottom-0 left-0 w-full bg-black/80 p-1 text-[8px] flex justify-between px-2">
                                <span>{isPC ? "RECEPTOR_CENTRAL" : "UNIDAD_MOVIL_STREAMING"}</span>
                                <span className="text-red-500">● LIVE</span>
                            </div>
                        </div>

                        {/* TU CÁMARA (Monitor de referencia) */}
                        <div className="lg:col-span-3">
                            <div className="border border-cyan-900 p-1 bg-black">
                                <video ref={myVideo} autoPlay playsInline muted className="w-full aspect-video grayscale contrast-125 border border-cyan-900/50" />
                                <p className="text-[9px] mt-1 text-center text-cyan-600 uppercase italic">
                                    {isPC ? "Monitor Operador" : "Vista de Cámara"}
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<WarRoom />);
    </script>
</body>
</html>
