<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V4.6 - STUN LINK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-cyan: #00f2ff; --dark-bg: #050508; }
        body { margin: 0; background: var(--dark-bg); color: var(--neon-cyan); font-family: 'monospace'; overflow-x: hidden; }
        .pulse-red { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const WarRoom = () => {
            const [myId, setMyId] = useState('');
            const [units, setUnits] = useState([]);
            const [isStreaming, setIsStreaming] = useState(false);
            const myVideo = useRef(null);
            const remoteVideo = useRef(null);
            const peer = useRef(null);

            useEffect(() => {
                // CONFIGURACIÓN STUN (Para saltar el muro de las operadoras móviles)
                peer.current = new Peer({
                    config: {'iceServers': [
                        { url: 'stun:stun.l.google.com:19302' },
                        { url: 'stun:stun1.l.google.com:19302' }
                    ]}
                });
                
                peer.current.on('open', async (id) => {
                    setMyId(id);
                    const isMobile = /iPhone|Android|iPad/i.test(navigator.userAgent);
                    const deviceName = isMobile ? `MOVIL_${id.substring(0,4)}` : `PC_${id.substring(0,4)}`;
                    
                    await supabaseClient.from('sentinel_units').upsert({ 
                        unit_name: deviceName, 
                        peer_id: id,
                        is_online: true 
                    });
                });

                peer.current.on('call', call => {
                    console.log("Recibiendo señal...");
                    call.answer(myVideo.current?.srcObject);
                    call.on('stream', stream => {
                        if (remoteVideo.current) {
                            remoteVideo.current.srcObject = stream;
                            remoteVideo.current.play();
                        }
                    });
                });

                const interval = setInterval(fetchUnits, 3000);
                return () => clearInterval(interval);
            }, []);

            const fetchUnits = async () => {
                const { data } = await supabaseClient.from('sentinel_units').select('*').eq('is_online', true);
                setUnits(data || []);
            };

            const startCam = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    myVideo.current.srcObject = stream;
                    setIsStreaming(true);
                } catch (e) { alert("Permite el acceso a la cámara"); }
            };

            const connectToUnit = async (remotePeerId) => {
                let stream = myVideo.current?.srcObject;
                if (!stream) {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    myVideo.current.srcObject = stream;
                    setIsStreaming(true);
                }
                const call = peer.current.call(remotePeerId, stream);
                call.on('stream', remoteStream => {
                    remoteVideo.current.srcObject = remoteStream;
                    remoteVideo.current.play();
                });
            };

            return (
                <div className="p-4 bg-black min-h-screen text-cyan-400 font-mono">
                    <header className="mb-4 border-b border-cyan-900 flex justify-between">
                        <h1 className="font-bold">SENTINEL V4.6 <span className="text-red-500 animate-pulse text-[10px]">● LIVE</span></h1>
                        <span className="text-[10px]">ID: {myId.substring(0,5)}</span>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
                        <div className="lg:col-span-1 border border-cyan-900 p-2">
                            <p className="text-[10px] mb-2 text-white">UNIDADES EN RED</p>
                            {units.map(u => u.peer_id !== myId && (
                                <button key={u.id} onClick={() => connectToUnit(u.peer_id)} className="w-full text-left bg-cyan-900/20 border border-cyan-400 p-2 mb-2 text-[10px] hover:bg-cyan-400 hover:text-black">
                                    📡 {u.unit_name}
                                </button>
                            ))}
                        </div>
                        <div className="lg:col-span-2 border border-red-900 p-1 bg-gray-950">
                            <video ref={remoteVideo} autoPlay playsInline className="w-full aspect-video object-cover" />
                        </div>
                        <div className="lg:col-span-1 border border-cyan-900 p-2">
                             <video ref={myVideo} autoPlay playsInline muted className="w-full aspect-video bg-black mb-2" />
                             {!isStreaming && <button onClick={startCam} className="w-full bg-cyan-600 text-black text-[10px] py-1 font-bold">ACTIVAR SEÑAL</button>}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<WarRoom />);
    </script>
</body>
</html>
