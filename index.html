<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART TECH - CONTROL CENTER V2</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* AQUÍ ESTÁ TU ESENCIA - NO SE TOCA */
        :root { --neon-blue: #00f2ff; --panic-red: #ff003c; --bg-dark: #020205; }
        body { background-color: var(--bg-dark); font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); overflow: hidden; height: 100vh; }
        #map { position: absolute; inset: 0; z-index: 1; filter: brightness(0.7) contrast(1.2) saturate(1.2); }
        
        .map-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(2, 2, 5, 0.8) 100%); pointer-events: none; z-index: 2; }
        
        /* Contenedores HUD */
        .hud-layer { position: relative; z-index: 10; height: 100vh; pointer-events: none; display: grid; grid-template-columns: 350px 1fr 350px; padding: 20px; gap: 20px; }
        .panel { pointer-events: auto; background: rgba(0, 15, 25, 0.8); border: 1px solid rgba(0, 242, 255, 0.3); backdrop-filter: blur(10px); box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .cam-box { width: 100%; aspect-ratio: 16/9; background: #000; border: 1px solid var(--neon-blue); position: relative; margin-bottom: 10px; }
        .cam-box video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) cyan; }
        
        .unit-marker { width: 15px; height: 15px; background: var(--neon-blue); border: 2px solid white; border-radius: 50%; box-shadow: 0 0 15px var(--neon-blue); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="map-overlay"></div>

    <div class="hud-layer">
        <div class="panel p-4 flex flex-col">
            <h2 className="text-xl font-bold italic mb-4 border-b border-cyan-900">SYSTEM_HEALTH</h2>
            <div id="unit-list" class="space-y-2 text-sm opacity-80">
                </div>
        </div>

        <div></div>

        <div class="flex flex-col gap-4">
            <div class="panel p-2">
                <div class="cam-box">
                    <video id="remoteVideo" autoPlay playsInline></video>
                    <div class="absolute top-2 left-2 text-[10px] bg-red-600 px-1 text-white font-bold animate-pulse">CAM_01 LIVE</div>
                </div>
            </div>
            
            <div class="panel p-4 flex-grow overflow-hidden">
                <h2 class="text-sm mb-2 border-b border-cyan-900">[MISSION_LOG]</h2>
                <div id="log" class="text-[10px] space-y-1 font-mono text-cyan-500">
                    <p>> SYSTEM BOOT COMPLETE...</p>
                    <p>> WAITING FOR UNIT UPLINK...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZbiujhcbiugrkhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        // 1. INICIALIZAR TU MAPA ORIGINAL
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-38.0055, -57.5426], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        const markers = {};

        // 2. VIDEO: PEERJS (Como receptor)
        const peer = new Peer('WAR_ROOM_CENTRAL');
        peer.on('call', call => {
            console.log("Recibiendo señal de video...");
            call.answer();
            call.on('stream', remoteStream => {
                document.getElementById('remoteVideo').srcObject = remoteStream;
            });
        });

        // 3. ACTUALIZACIÓN DE UNIDADES (Supabase)
        async function updateDashboard() {
            const { data: units } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
            const listContainer = document.getElementById('unit-list');
            const logContainer = document.getElementById('log');

            if (units) {
                listContainer.innerHTML = '';
                units.forEach(u => {
                    // Actualizar Lista
                    listContainer.innerHTML += `<div class="p-2 border-l-2 border-cyan-500 bg-cyan-950/20">${u.unit_name} - <span class="text-xs">ACTIVO</span></div>`;

                    // Actualizar Mapa
                    if (u.lat && u.lng) {
                        if (!markers[u.id]) {
                            markers[u.id] = L.marker([u.lat, u.lng], {
                                icon: L.divIcon({ className: 'unit-marker' })
                            }).addTo(map);
                            logContainer.innerHTML += `<p class="text-white">> NUEVA UNIDAD DETECTADA: ${u.unit_name}</p>`;
                        } else {
                            markers[u.id].setLatLng([u.lat, u.lng]);
                        }
                    }
                });
            }
        }

        // Escuchar Alertas en Tiempo Real
        supabase.channel('alerts').on('postgres_changes', { event: 'INSERT', table: 'sentinel_alerts' }, payload => {
            const log = document.getElementById('log');
            log.innerHTML = `<p class="text-red-500 font-bold animate-bounce">> !!! ALERTA DE PÁNICO: UNIDAD ${payload.new.unit_id} !!!</p>` + log.innerHTML;
        }).subscribe();

        setInterval(updateDashboard, 3000);
    </script>
</body>
</html>
