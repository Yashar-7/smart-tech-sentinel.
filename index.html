<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V5.1 - PANIC MODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon-cyan: #00f2ff; --dark-bg: #050508; }
        body { margin: 0; background: var(--dark-bg); color: var(--neon-cyan); font-family: 'monospace'; overflow: hidden; }
        .panic-alert { animation: panic-bg 0.5s infinite; }
        @keyframes panic-bg { 0% { background: #000; } 50% { background: #450a0a; } 100% { background: #000; } }
        .scanline { width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1); position: absolute; top: 0; animation: scan 4s linear infinite; z-index: 10; pointer-events: none; }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
    </style>
</head>
<body id="main-body">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const WarRoom = () => {
            const [myId, setMyId] = useState('');
            const [units, setUnits] = useState([]);
            const [isPC] = useState(!/iPhone|Android|iPad/i.test(navigator.userAgent));
            const [isReady, setIsReady] = useState(false);
            const [panicMode, setPanicMode] = useState(false);
            const myVideo = useRef(null);
            const remoteVideo = useRef(null);
            const peerInstance = useRef(null);

            useEffect(() => {
                const init = async () => {
                    const peer = new Peer({ config: {'iceServers': [{ url: 'stun:stun.l.google.com:19302' }]} });
                    peer.on('open', async (id) => {
                        setMyId(id);
                        await supabaseClient.from('sentinel_units').upsert({ 
                            unit_name: isPC ? "CENTRAL_WAR_ROOM" : `UNIDAD_${id.substring(0,4)}`, 
                            peer_id: id, is_online: true 
                        });
                    });
                    peer.on('call', call => {
                        call.answer(myVideo.current?.srcObject);
                        call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                    });
                    peerInstance.current = peer;
                };
                init();
                
                // Suscribirse a alertas en tiempo real
                const channel = supabaseClient
                    .channel('alerts')
                    .on('postgres_changes', { event: 'INSERT', table: 'sentinel_alerts' }, payload => {
                        if (isPC) triggerPanic();
                    })
                    .subscribe();

                const interval = setInterval(fetchUnits, 3000);
                return () => { clearInterval(interval); supabaseClient.removeChannel(channel); };
            }, [isPC]);

            const fetchUnits = async () => {
                const { data } = await supabaseClient.from('sentinel_units').select('*').eq('is_online', true);
                setUnits(data || []);
            };

            const triggerPanic = () => {
                setPanicMode(true);
                const audio = new Audio('https://www.soundjay.com/buttons/beep-01a.mp3'); // Sonido provisional
                audio.play();
                setTimeout(() => setPanicMode(false), 5000); // La alerta visual dura 5 segundos
            };

            const sendAlert = async () => {
                await supabaseClient.from('sentinel_alerts').insert([{ unit_id: myId, type: 'CRITICAL' }]);
                alert("ALERTA ENVIADA A CENTRAL");
            };

            const initialize = async () => {
                const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                if (myVideo.current) myVideo.current.srcObject = s;
                setIsReady(true);
            };

            return (
                <div className={`p-4 min-h-screen ${panicMode ? 'panic-alert' : 'bg-black'} transition-colors duration-300`}>
                    <div className="scanline"></div>
                    
                    <div className="flex justify-between items-center border-b border-cyan-900 mb-4 pb-2">
                        <h1 className="text-xl font-bold tracking-tighter">SENTINEL <span className={panicMode ? 'text-red-500' : 'text-cyan-500'}>V5.1</span></h1>
                        <div className="flex gap-2">
                            {!isReady && <button onClick={initialize} className="bg-cyan-600 text-black px-3 py-1 text-[10px] font-bold">INICIALIZAR</button>}
                            {!isPC && isReady && <button onClick={sendAlert} className="bg-red-600 text-white px-3 py-1 text-[10px] font-bold border border-white pulse-red">PÁNICO</button>}
                        </div>
                    </div>

                    <div className="grid grid-cols-12 gap-4">
                        {isPC && (
                            <div className="col-span-3 border border-cyan-900 p-2 bg-black/50">
                                <p className="text-[9px] text-white underline mb-2 tracking-widest">RED OPERATIVA</p>
                                {units.filter(u => u.peer_id !== myId).map(u => (
                                    <button key={u.id} onClick={() => peerInstance.current.call(u.peer_id, myVideo.current.srcObject).on('stream', s => remoteVideo.current.srcObject = s)} 
                                        className="w-full text-left border border-cyan-800 p-2 mb-2 text-[10px] hover:bg-cyan-500 hover:text-black">
                                        🛰️ {u.unit_name}
                                    </button>
                                ))}
                            </div>
                        )}

                        <div className={`${isPC ? 'col-span-6' : 'col-span-12'} border ${panicMode ? 'border-red-500' : 'border-cyan-900'} bg-black relative`}>
                            {panicMode && <div className="absolute inset-0 z-20 flex items-center justify-center bg-red-900/20"><h2 className="text-red-500 text-2xl font-black animate-ping text-center">!!! ALERTA CRÍTICA !!!</h2></div>}
                            <video ref={remoteVideo} autoPlay playsInline className="w-full aspect-video object-cover" />
                        </div>

                        <div className={`${isPC ? 'col-span-3' : 'col-span-12'} border border-cyan-900 p-2 bg-black`}>
                            <video ref={myVideo} autoPlay playsInline muted className="w-full aspect-video grayscale contrast-150 border border-cyan-900/30" />
                            <p className="text-[9px] text-center mt-2">MONITOR_LOCAL</p>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<WarRoom />);
    </script>
</body>
</html>
