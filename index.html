<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL V6.0 - WAR ROOM INTEGRATED</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --neon: #00f2ff; --panic: #ff003c; --bg: #020203; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        .cyber-panel { border: 1px solid rgba(0, 242, 255, 0.2); background: rgba(0, 0, 0, 0.9); }
        #map { background: #000; filter: invert(100%) hue-rotate(180deg) brightness(0.6) contrast(1.2); }
        .panic-pulse { animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(255, 0, 60, 0.7); } 100% { box-shadow: 0 0 0 20px rgba(255, 0, 60, 0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        const WarRoom = () => {
            const [units, setUnits] = useState([]);
            const [activeCall, setActiveCall] = useState(null);
            const mapRef = useRef(null);
            const markersRef = useRef({});
            const remoteVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                // Inicializar Mapa centrado en Mar del Plata
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false }).setView([-38.0055, -57.5426], 13);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapRef.current);
                }

                // Inicializar Peer (Solo receptor)
                const peer = new Peer('WAR_ROOM_CENTRAL');
                peer.on('call', call => {
                    call.answer();
                    call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                    setActiveCall(true);
                });
                peerRef.current = peer;

                // Suscribirse a Alertas y Unidades
                const timer = setInterval(async () => {
                    const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
                    if (data) {
                        setUnits(data);
                        data.forEach(u => {
                            if (u.lat && u.lng) {
                                if (!markersRef.current[u.id]) {
                                    markersRef.current[u.id] = L.circleMarker([u.lat, u.lng], { 
                                        color: u.unit_name.includes('MOVIL') ? '#00f2ff' : '#fff',
                                        radius: 6 
                                    }).addTo(mapRef.current);
                                } else {
                                    markersRef.current[u.id].setLatLng([u.lat, u.lng]);
                                }
                            }
                        });
                    }
                }, 3000);

                return () => { clearInterval(timer); peer.destroy(); };
            }, []);

            return (
                <div className="h-screen w-screen grid grid-cols-12 p-2 gap-2">
                    {/* Mapa Global */}
                    <div className="col-span-8 cyber-panel relative">
                        <div id="map" className="w-full h-full"></div>
                        <div className="absolute top-4 left-4 z-[1000] bg-black/80 p-2 text-[10px] border border-cyan-500">
                            SISTEMA_VIVA_MDP // STATUS: OPERATIVO
                        </div>
                    </div>

                    {/* Panel de Control y Video */}
                    <div className="col-span-4 flex flex-col gap-2">
                        <div className="h-1/2 cyber-panel relative overflow-hidden bg-black">
                            <video ref={remoteVideo} autoPlay playsInline className="w-full h-full object-cover grayscale contrast-125" />
                            {!activeCall && <div className="absolute inset-0 flex items-center justify-center text-[10px] opacity-30 italic">ESPERANDO SEÑAL VISUAL...</div>}
                            {activeCall && <div className="absolute top-2 left-2 bg-red-600 px-2 text-[10px] font-bold animate-pulse text-white">LIVE_FEED</div>}
                        </div>
                        
                        <div className="h-1/2 cyber-panel p-2 overflow-y-auto">
                            <p className="text-[10px] border-b border-cyan-900 mb-2">INCIDENT_FEED</p>
                            {units.map(u => (
                                <div key={u.id} className="text-[9px] mb-1 flex justify-between opacity-70">
                                    <span>> {u.unit_name}</span>
                                    <span className="text-cyan-500">CONECTADO</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const MobileUnit = () => {
            const [myId, setMyId] = useState('');
            const unitName = localStorage.getItem('sentinel_name') || 'MOVIL_UNIDAD';
            const myVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                const peer = new Peer();
                peer.on('open', id => {
                    setMyId(id);
                    supabase.from('sentinel_units').upsert({ unit_name: unitName, peer_id: id, is_online: true });
                    
                    navigator.geolocation.watchPosition(p => {
                        supabase.from('sentinel_units').update({ lat: p.coords.latitude, lng: p.coords.longitude }).eq('peer_id', id);
                    }, null, { enableHighAccuracy: true });
                });
                peerRef.current = peer;

                // Activar cámara automáticamente para estar listo
                navigator.mediaDevices.getUserMedia({ video: true, audio: false }).then(s => {
                    if (myVideo.current) myVideo.current.srcObject = s;
                });

                return () => peer.destroy();
            }, []);

            const triggerPanic = async () => {
                // 1. Mandar Alerta a Supabase
                await supabase.from('sentinel_alerts').insert([{ unit_id: myId }]);
                // 2. Llamar al War Room automáticamente
                const stream = myVideo.current.srcObject;
                peerRef.current.call('WAR_ROOM_CENTRAL', stream);
            };

            return (
                <div className="h-screen w-screen bg-black p-4 flex flex-col items-center justify-center gap-6">
                    <div className="w-full aspect-video cyber-panel overflow-hidden">
                        <video ref={myVideo} autoPlay playsInline muted className="w-full h-full object-cover grayscale" />
                    </div>
                    <div className="text-center">
                        <h1 className="text-cyan-500 font-bold tracking-widest">{unitName}</h1>
                        <p className="text-[10px] opacity-40">SISTEMA SENTINEL TRANSMITIENDO POSICIÓN</p>
                    </div>
                    <button onClick={triggerPanic} className="w-full py-12 bg-red-600 text-white font-black text-4xl border-b-8 border-red-950 active:border-0 rounded-xl panic-pulse">PÁNICO</button>
                </div>
            );
        };

        const App = () => {
            const isPC = !/iPhone|Android|iPad/i.test(navigator.userAgent);
            return isPC ? <WarRoom /> : <MobileUnit />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
