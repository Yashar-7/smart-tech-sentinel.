<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART TECH - ORIGINAL DASHBOARD RESTORED</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* ESTA ES TU ESENCIA ORIGINAL - COPIADA TAL CUAL */
        :root { --neon-blue: #00f2ff; --bg-dark: #020205; }
        body { background-color: var(--bg-dark); font-family: 'Share Tech Mono', monospace; color: var(--neon-blue); margin: 0; overflow: hidden; }
        
        #map { position: absolute; inset: 0; z-index: 1; }
        
        /* EL FILTRO MÁGICO QUE TE GUSTABA */
        .leaflet-tile-container {
            filter: brightness(0.5) contrast(1.4) sepia(1) hue-rotate(145deg) saturate(2.5) !important;
        }

        .map-overlay { 
            position: absolute; inset: 0; 
            background: radial-gradient(circle, transparent 20%, rgba(2, 2, 5, 0.9) 100%); 
            pointer-events: none; z-index: 2; 
        }

        .hud { position: relative; z-index: 10; height: 100vh; pointer-events: none; display: flex; flex-direction: column; padding: 25px; }
        .panel { pointer-events: auto; background: rgba(0, 10, 20, 0.85); border: 1px solid var(--neon-blue); backdrop-filter: blur(8px); }
        
        /* Estilo de los Marcadores (Tus iconos de Mar del Plata) */
        .custom-marker {
            width: 12px; height: 12px; background: var(--neon-blue);
            border: 2px solid white; border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-blue);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.4); opacity: 0.7; } 100% { transform: scale(1); } }
        
        .video-container { width: 300px; aspect-ratio: 16/9; border: 1px solid var(--neon-blue); background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="map-overlay"></div>

    <div class="hud">
        <div class="flex justify-between items-start">
            <div class="panel p-4">
                <h1 class="text-2xl font-black italic tracking-tighter">SMART TECH - SENTINEL</h1>
                <p class="text-[10px] opacity-60 uppercase">Mar del Plata - Control Operativo</p>
            </div>

            <div class="panel p-2">
                <div class="video-container">
                    <video id="remoteVideo" autoPlay playsInline></video>
                    <div class="absolute top-1 left-1 bg-red-600 px-1 text-[8px] font-bold text-white animate-pulse">CAM_01 LIVE</div>
                </div>
            </div>
        </div>

        <div class="mt-auto flex justify-between items-end">
            <div class="panel p-4 w-64">
                <h2 class="text-xs mb-2 border-b border-cyan-900">UNIDADES_ACTIVAS</h2>
                <div id="unit-list" class="text-[10px] space-y-1">
                    <p class="opacity-40 italic">Buscando señales...</p>
                </div>
            </div>
            
            <div class="panel p-4 w-80 h-32 overflow-hidden">
                <h2 class="text-xs mb-2 border-b border-cyan-900">MISSION_LOG</h2>
                <div id="log-feed" class="text-[9px] font-mono opacity-80">
                    <p>> SYSTEM INITIATED...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. INICIALIZACIÓN DEL MAPA EXACTO
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([-38.0055, -57.5426], 14);
        
        // Esta es la capa que le da el fondo oscuro profesional
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // 2. CONEXIÓN SUPABASE (Para mover tus iconos en el mapa)
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZbiujhcbiugrkhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        const markers = {};

        // Función para actualizar posiciones de verdad
        async function syncUnits() {
            const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
            const list = document.getElementById('unit-list');
            
            if (data) {
                list.innerHTML = "";
                data.forEach(u => {
                    list.innerHTML += `<p>> ${u.unit_name} [ONLINE]</p>`;
                    if (u.lat && u.lng) {
                        if (!markers[u.id]) {
                            markers[u.id] = L.marker([u.lat, u.lng], {
                                icon: L.divIcon({ className: 'custom-marker' })
                            }).addTo(map);
                        } else {
                            markers[u.id].setLatLng([u.lat, u.lng]);
                        }
                    }
                });
            }
        }
        setInterval(syncUnits, 3000);

        // 3. RECIBIR VIDEO DEL CELULAR
        const peer = new Peer('WAR_ROOM_CENTRAL');
        peer.on('call', call => {
            call.answer();
            call.on('stream', stream => {
                document.getElementById('remoteVideo').srcObject = stream;
            });
        });
    </script>
</body>
</html>
