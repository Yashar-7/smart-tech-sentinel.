<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V5.3 - RECOVERY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root { --neon: #00f2ff; --panic: #ff003c; --bg: #020203; }
        body { background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; margin: 0; overflow: hidden; }
        .cyber-border { border: 1px solid rgba(0, 242, 255, 0.2); }
        .grid-bg { background-image: linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px); background-size: 40px 40px; }
        .panic-flash { animation: flash-red 0.5s infinite; }
        @keyframes flash-red { 0%, 100% { border-color: var(--panic); box-shadow: 0 0 10px var(--panic); } 50% { border-color: transparent; box-shadow: none; } }
    </style>
</head>
<body class="grid-bg">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const SentinelApp = () => {
            const [unitName, setUnitName] = useState(localStorage.getItem('sentinel_name') || '');
            const [isPC] = useState(!/iPhone|Android|iPad/i.test(navigator.userAgent));
            const [units, setUnits] = useState([]);
            const [panicData, setPanicData] = useState(null);
            const myVideo = useRef(null);
            const remoteVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                // Solo pedir nombre si es móvil y no tiene uno guardado
                if (!isPC && !unitName) {
                    const name = prompt("IDENTIFICACIÓN DE UNIDAD:");
                    const finalName = name ? name.toUpperCase() : "MOVIL_ANONIMO";
                    setUnitName(finalName);
                    localStorage.setItem('sentinel_name', finalName);
                }
                
                initPeer();
                const interval = setInterval(fetchUnits, 4000);
                
                // Suscripción Realtime
                const sub = supabase.channel('alerts_room')
                    .on('postgres_changes', { event: 'INSERT', table: 'sentinel_alerts' }, payload => {
                        handlePanic(payload.new.unit_id);
                    }).subscribe();

                return () => { clearInterval(interval); supabase.removeChannel(sub); };
            }, []);

            const initPeer = () => {
                const peer = new Peer({ config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }] } });
                peer.on('open', id => {
                    const nameToReg = isPC ? "WAR_ROOM_CENTRAL" : (unitName || "MOVIL_STBY");
                    supabase.from('sentinel_units').upsert({ unit_name: nameToReg, peer_id: id, is_online: true });
                    
                    // GPS Silencioso (si falla, no rompe la app)
                    if (!isPC) {
                        navigator.geolocation.getCurrentPosition(pos => {
                            supabase.from('sentinel_units').update({ lat: pos.coords.latitude, lng: pos.coords.longitude }).eq('peer_id', id);
                        }, e => console.log("GPS bloqueado"));
                    }
                });

                peer.on('call', call => {
                    call.answer(myVideo.current?.srcObject);
                    call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                });
                peerRef.current = peer;
            };

            const fetchUnits = async () => {
                const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
                if (data) setUnits(data);
            };

            const handlePanic = async (id) => {
                const { data } = await supabase.from('sentinel_units').select('unit_name, peer_id').eq('peer_id', id).single();
                if (data) {
                    setPanicData(data.unit_name);
                    // Central llama automáticamente al que entró en pánico
                    if (isPC) {
                        const call = peerRef.current.call(data.peer_id, myVideo.current?.srcObject);
                        call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                    }
                    setTimeout(() => setPanicData(null), 8000);
                }
            };

            const startSystem = async () => {
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    if (myVideo.current) myVideo.current.srcObject = s;
                } catch (e) { alert("Error de cámara"); }
            };

            return (
                <div className="h-screen w-screen p-4 flex flex-col">
                    {/* Header Cyber */}
                    <header className="flex justify-between border-b border-cyan-500/50 pb-2 mb-4">
                        <div className="font-black italic tracking-widest text-xl">SENTINEL <span className="text-white">V5.3</span></div>
                        <button onClick={startSystem} className="text-[10px] bg-cyan-500/10 border border-cyan-500 px-4 hover:bg-cyan-500 hover:text-black transition-all">INICIALIZAR_SISTEMA</button>
                    </header>

                    <div className="flex-grow grid grid-cols-12 gap-4 overflow-hidden">
                        {/* Panel Unidades (Solo PC) */}
                        {isPC && (
                            <div className="col-span-3 space-y-2 overflow-y-auto">
                                <p className="text-[10px] opacity-50 mb-4 tracking-[0.3em]">REPOSITORIO_NODOS</p>
                                {units.map(u => (
                                    <div key={u.id} className="cyber-border p-2 bg-black/60 flex justify-between items-center group">
                                        <span className="text-[10px] font-bold">{u.unit_name}</span>
                                        <button onClick={() => peerRef.current.call(u.peer_id, myVideo.current?.srcObject).on('stream', s => remoteVideo.current.srcObject = s)} 
                                            className="text-[8px] bg-cyan-950 px-2 py-1 border border-cyan-500 opacity-0 group-hover:opacity-100 transition-opacity">CONECTAR</button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Monitor Principal */}
                        <div className={`${isPC ? 'col-span-6' : 'col-span-12'} cyber-border bg-black relative flex items-center justify-center`}>
                            {panicData && (
                                <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-red-950/60 backdrop-blur-md border-4 border-red-600 panic-flash">
                                    <h2 className="text-3xl font-black text-white italic">ALERTA: {panicData}</h2>
                                    <div className="text-[10px] tracking-[1em] text-red-500 animate-pulse">INTROMISIÓN_DETECTADA</div>
                                </div>
                            )}
                            <video ref={remoteVideo} autoPlay playsInline className="w-full h-full object-cover" />
                            {!panicData && <div className="absolute text-[10px] opacity-10 font-bold uppercase tracking-[2em]">Waiting_Signal</div>}
                        </div>

                        {/* Lateral Derecho / Controles Móvil */}
                        <div className={`${isPC ? 'col-span-3' : 'col-span-12'} flex flex-col gap-4`}>
                            <div className="cyber-border p-1 bg-black">
                                <video ref={myVideo} autoPlay playsInline muted className="w-full aspect-video grayscale border border-cyan-900/50" />
                                <p className="text-[8px] text-center mt-1 text-cyan-800 tracking-widest uppercase">{unitName || 'TERMINAL_CENTRAL'}</p>
                            </div>
                            {!isPC && (
                                <button onClick={() => supabase.from('sentinel_alerts').insert([{ unit_id: peerRef.current.id }])} 
                                    className="flex-grow bg-red-600 text-white font-black text-2xl italic border-b-8 border-red-900 active:translate-y-1 active:border-b-0 transition-all">
                                    PÁNICO
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<SentinelApp />);
    </script>
</body>
</html>
