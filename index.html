<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL V6.1 - TACTICAL HUD</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --neon: #00f2ff; --panic: #ff003c; --bg: #010103; }
        body, html, #root { height: 100%; margin: 0; background: var(--bg); color: var(--neon); font-family: 'Courier New', monospace; overflow: hidden; }
        
        /* ESTILO CYBER MAP */
        #map { 
            position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1;
            filter: invert(100%) hue-rotate(170deg) brightness(0.5) contrast(1.3);
            background: #000 !important;
        }

        .cyber-hud { 
            position: relative; z-index: 10; pointer-events: none;
            height: 100%; padding: 20px; display: grid;
            grid-template-columns: 300px 1fr 350px; grid-template-rows: 1fr 200px; gap: 20px;
        }
        
        .panel { 
            pointer-events: auto; background: rgba(0, 5, 10, 0.85);
            border: 1px solid rgba(0, 242, 255, 0.3); backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 15px rgba(0, 242, 255, 0.05);
        }

        .scanline {
            width: 100%; height: 2px; background: rgba(0, 242, 255, 0.1);
            position: absolute; animation: scan 4s linear infinite; z-index: 20;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }
        
        .panic-overlay { 
            position: absolute; inset: 0; z-index: 100; pointer-events: none;
            border: 10px solid #ff003c; animation: panic-border 0.5s infinite;
        }
        @keyframes panic-border { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZbiujhcbiugrkhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        const WarRoom = () => {
            const [units, setUnits] = useState([]);
            const [activePanic, setActivePanic] = useState(null);
            const mapRef = useRef(null);
            const markersRef = useRef({});
            const remoteVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                // Forzar carga de mapa
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false, attributionControl: false }).setView([-38.0055, -57.5426], 14);
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapRef.current);
                    setTimeout(() => mapRef.current.invalidateSize(), 500);
                }

                const peer = new Peer('WAR_ROOM_CENTRAL');
                peer.on('call', call => {
                    call.answer();
                    call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                });
                peerRef.current = peer;

                const timer = setInterval(async () => {
                    const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
                    if (data) {
                        setUnits(data);
                        data.forEach(u => {
                            if (u.lat && u.lng) {
                                if (!markersRef.current[u.id]) {
                                    markersRef.current[u.id] = L.circleMarker([u.lat, u.lng], { 
                                        color: '#00f2ff', fillColor: '#00f2ff', fillOpacity: 0.8, radius: 5 
                                    }).addTo(mapRef.current).bindTooltip(u.unit_name, { permanent: true, direction: 'top', className: 'cyber-label' });
                                } else {
                                    markersRef.current[u.id].setLatLng([u.lat, u.lng]);
                                }
                            }
                        });
                    }
                }, 3000);

                // Escuchar pánico
                const sub = supabase.channel('alerts').on('postgres_changes', { event: 'INSERT', table: 'sentinel_alerts' }, async (payload) => {
                    const { data } = await supabase.from('sentinel_units').select('unit_name').eq('peer_id', payload.new.unit_id).single();
                    if(data) {
                        setActivePanic(data.unit_name);
                        setTimeout(() => setActivePanic(null), 10000);
                    }
                }).subscribe();

                return () => { clearInterval(timer); peer.destroy(); supabase.removeChannel(sub); };
            }, []);

            return (
                <div className="relative h-full w-full">
                    <div id="map"></div>
                    {activePanic && <div className="panic-overlay"></div>}

                    <div className="cyber-hud">
                        {/* Panel Izquierdo: Unidades */}
                        <div className="panel p-4 flex flex-col">
                            <h2 className="text-[12px] font-bold border-b border-cyan-500 mb-4 tracking-widest">RED_OPERATIVA</h2>
                            <div className="flex-grow space-y-2 overflow-y-auto">
                                {units.map(u => (
                                    <div key={u.id} className="p-2 border border-cyan-500/20 bg-cyan-500/5 flex justify-between items-center">
                                        <span className="text-[10px]">{u.unit_name}</span>
                                        <div className="w-2 h-2 bg-cyan-500 rounded-full animate-pulse"></div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* Espacio Central Libre (Mapa) */}
                        <div></div>

                        {/* Panel Derecho: Video y Consola */}
                        <div className="flex flex-col gap-4">
                            <div className="panel relative aspect-video overflow-hidden">
                                <div className="scanline"></div>
                                <video ref={remoteVideo} autoPlay playsInline className="w-full h-full object-cover grayscale contrast-125" />
                                <div className="absolute bottom-2 left-2 text-[8px] bg-black/80 px-1">LIVE_FEED_SIGNAL</div>
                            </div>

                            <div className="panel flex-grow p-4 overflow-hidden flex flex-col">
                                <h2 className="text-[10px] opacity-50 mb-2 underline">INCIDENT_LOG</h2>
                                <div className="flex-grow text-[9px] space-y-1 font-mono opacity-80">
                                    <p className="text-cyan-300">> SYSTEM_BOOT_V6.1... OK</p>
                                    <p className="text-cyan-300">> ENCRYPTED_LINK... ESTABLISHED</p>
                                    {activePanic && <p className="text-red-500 animate-pulse">> ALERT: CRITICAL_PANIC_FROM_{activePanic}</p>}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-[200] text-[10px] tracking-[0.5em] opacity-30">
                        MAR DEL PLATA VIVA // CORE_SENTINEL
                    </div>
                </div>
            );
        };

        // ... (El componente MobileUnit se mantiene igual al anterior) ...
        const MobileUnit = () => { /* Código del móvil del mensaje anterior */ };

        const App = () => {
            const isPC = !/iPhone|Android|iPad/i.test(navigator.userAgent);
            return isPC ? <WarRoom /> : <MobileUnit />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
