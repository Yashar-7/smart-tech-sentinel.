<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTINEL CORE - RESTORED</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root { --neon: #00f2ff; --bg: #010203; }
        body, html, #root { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        /* ESTE ES EL MAPA DE LA FOTO */
        #map { 
            position: absolute; inset: 0; z-index: 1; 
            background: #090909 !important;
        }

        /* EL FILTRO QUE LE DA EL TONO CIAN TÁCTICO */
        .leaflet-tile-container {
            filter: brightness(0.6) contrast(1.2) sepia(1) hue-rotate(140deg) saturate(2);
        }

        .hud { position: absolute; inset: 0; z-index: 1000; pointer-events: none; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .panel { pointer-events: auto; background: rgba(0, 10, 15, 0.9); border: 1px solid var(--neon); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); backdrop-filter: blur(10px); }
        
        .unit-marker { 
            width: 12px; height: 12px; background: var(--neon); 
            border: 2px solid white; border-radius: 50%; 
            box-shadow: 0 0 15px var(--neon); 
        }

        .video-feed { width: 320px; aspect-ratio: 16/9; border: 1px solid var(--neon); background: #000; overflow: hidden; }
        .video-feed video { width: 100%; height: 100%; object-fit: cover; grayscale: 1; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;
        const supabase = window.supabase.createClient('https://svpurpvbiujhcbiugrkh.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZbiujhcbiugrkhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc');

        const WarRoom = () => {
            const mapRef = useRef(null);
            const [units, setUnits] = useState([]);
            const remoteVideo = useRef(null);
            const markersRef = useRef({});

            useEffect(() => {
                if (!mapRef.current) {
                    mapRef.current = L.map('map', { zoomControl: false, attributionControl: false }).setView([-38.0055, -57.5426], 14);
                    
                    // CARGA DEL MAPA OSCURO ORIGINAL
                    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(mapRef.current);
                }

                const peer = new Peer('WAR_ROOM_CENTRAL');
                peer.on('call', call => {
                    call.answer();
                    call.on('stream', s => { if(remoteVideo.current) remoteVideo.current.srcObject = s; });
                });

                const interval = setInterval(async () => {
                    const { data } = await supabase.from('sentinel_units').select('*').eq('is_online', true);
                    if (data) {
                        setUnits(data);
                        data.forEach(u => {
                            if (u.lat && u.lng) {
                                if (!markersRef.current[u.id]) {
                                    const icon = L.divIcon({ className: 'unit-marker' });
                                    markersRef.current[u.id] = L.marker([u.lat, u.lng], { icon }).addTo(mapRef.current);
                                } else {
                                    markersRef.current[u.id].setLatLng([u.lat, u.lng]);
                                }
                            }
                        });
                    }
                }, 2000);

                return () => { clearInterval(interval); peer.destroy(); };
            }, []);

            return (
                <div className="h-full w-full relative">
                    <div id="map"></div>
                    <div className="hud">
                        <div className="flex justify-between items-start">
                            <div className="panel p-4">
                                <h1 className="text-cyan-400 font-bold tracking-tighter text-xl italic">CORE_CONTROL_CENTER</h1>
                                <p className="text-[10px] opacity-50 underline">MAR DEL PLATA VIVA // STATUS: ACTIVE</p>
                            </div>
                            <div className="panel p-2">
                                <div className="video-feed">
                                    <video ref={remoteVideo} autoPlay playsInline />
                                </div>
                                <p className="text-[9px] text-center mt-1 text-red-500 animate-pulse">LIVE_SIGNAL_INCOMING</p>
                            </div>
                        </div>
                        
                        <div className="panel p-4 w-64 mb-10">
                            <h2 className="text-[10px] mb-2 border-b border-cyan-900">INCIDENT_FEED</h2>
                            <div className="text-[9px] space-y-1 max-h-32 overflow-y-auto">
                                {units.map(u => <p key={u.id} className="text-cyan-500">> {u.unit_name}: ONLINE</p>)}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MobileUnit = () => {
            const [myId, setMyId] = useState('...');
            const myVideo = useRef(null);
            const peerRef = useRef(null);

            useEffect(() => {
                const peer = new Peer();
                peerRef.current = peer;
                peer.on('open', id => {
                    setMyId(id);
                    navigator.geolocation.watchPosition(pos => {
                        supabase.from('sentinel_units').upsert({ 
                            unit_name: 'MOVIL_ALPHA', 
                            peer_id: id, 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude,
                            is_online: true 
                        });
                    }, null, { enableHighAccuracy: true });
                });
                navigator.mediaDevices.getUserMedia({ video: true }).then(s => { myVideo.current.srcObject = s; });
            }, []);

            return (
                <div className="h-screen w-screen bg-black p-6 flex flex-col justify-between items-center">
                    <div className="w-full aspect-video border border-cyan-500 overflow-hidden">
                        <video ref={myVideo} autoPlay playsInline muted className="w-full h-full object-cover grayscale" />
                    </div>
                    <button 
                        onClick={() => {
                            peerRef.current.call('WAR_ROOM_CENTRAL', myVideo.current.srcObject);
                            supabase.from('sentinel_alerts').insert([{ unit_id: myId }]);
                        }}
                        className="w-full py-10 bg-red-600 text-white font-bold text-3xl rounded-xl border-b-8 border-red-900 active:border-0"
                    >PÁNICO</button>
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = useState(null);
            if (!mode) return (
                <div className="h-screen bg-black flex flex-col items-center justify-center gap-6">
                    <h1 className="text-cyan-500 text-2xl font-black italic mb-10">SMART TECH SENTINEL</h1>
                    <button onClick={() => setMode('warroom')} className="w-64 p-4 border-2 border-cyan-500 text-cyan-500 font-bold hover:bg-cyan-500 hover:text-black">ENTRAR AL DASHBOARD</button>
                    <button onClick={() => setMode('mobile')} className="w-64 p-4 border-2 border-cyan-500 text-cyan-500 font-bold hover:bg-cyan-500 hover:text-black">ENTRAR COMO UNIDAD</button>
                </div>
            );
            return mode === 'warroom' ? <WarRoom /> : <MobileUnit />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
