<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENTINEL V4.1 - Smart Tech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --dark-bg: #050508;
        }
        body {
            margin: 0;
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Tu componente SentinelVision
        const SentinelVision = ({ label = 'Live Feed: Almacén_01' }) => {
            const VIDEO_ID = '36pY9v6m-48';
            return (
                <div className="border-2 border-cyan-500 bg-black p-1 relative mb-4">
                    <div className="aspect-video bg-slate-900 relative overflow-hidden">
                        <iframe
                            src={`https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&mute=1&controls=0`}
                            title="Security feed"
                            className="absolute inset-0 w-full h-full object-cover grayscale opacity-50"
                        />
                        <div className="absolute top-2 left-2 flex items-center gap-2">
                            <div className="h-2 w-2 animate-pulse rounded-full bg-red-600" />
                            <span className="text-[10px] text-cyan-400 font-mono">{label}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Tu componente WarRoom principal
        const WarRoom = () => {
            const [isStreaming, setIsStreaming] = useState(false);
            const videoRef = useRef(null);

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setIsStreaming(true);
                    }
                } catch (err) {
                    alert("Error: Permiso de cámara denegado o no encontrada.");
                }
            };

            return (
                <div className="min-h-screen bg-black text-cyan-500 font-mono p-4">
                    <header className="border-b border-cyan-900 pb-2 mb-4 flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-white tracking-widest">SENTINEL <span className="text-cyan-500">V4.1</span></h1>
                            <p className="text-[10px] text-green-500 animate-pulse">SISTEMA OPERATIVO - MODO WAR ROOM</p>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-4">
                        <div className="lg:col-span-8 border border-cyan-900 h-[400px] lg:h-[600px] relative bg-slate-950">
                            <iframe
                                src="https://www.openstreetmap.org/export/embed.html?bbox=-57.65,-38.05,-57.42,-37.96&layer=mapnik"
                                className="w-full h-full border-0 opacity-40 grayscale"
                            />
                        </div>

                        <div className="lg:col-span-4 flex flex-col gap-4">
                            <SentinelVision label="TACTICAL_FEED_01" />
                            <div className="border border-cyan-900 bg-black p-2">
                                <p className="text-[10px] text-cyan-600 mb-2 underline text-center">CAM_UNIT_REMOTE</p>
                                <div className="aspect-video bg-slate-900 flex items-center justify-center relative overflow-hidden border border-cyan-500/30">
                                    {isStreaming ? (
                                        <video ref={videoRef} autoPlay playsInline className="w-full h-full object-cover" />
                                    ) : (
                                        <button 
                                            onClick={startCamera}
                                            className="bg-cyan-900/20 border-2 border-cyan-500 px-6 py-3 text-xs hover:bg-cyan-500 hover:text-black font-bold transition-all shadow-[0_0_15px_rgba(0,242,255,0.3)]"
                                        >
                                            ACTIVAR CÁMARA TRASERA
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WarRoom />);
    </script>
</body>
</html>
