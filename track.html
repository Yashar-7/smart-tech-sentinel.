<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050508">
    <title>Baliza Sentinel — CORE V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --dark-bg: #050508;
            --gray-off: #2a2a2e;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'VT323', 'JetBrains Mono', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
        }
        .track-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .track-title {
            font-size: clamp(1rem, 4vw, 1.2rem);
            letter-spacing: 4px;
            color: rgba(0, 242, 255, 0.85);
            text-align: center;
        }
        .beacon-btn-wrap {
            position: relative;
            width: min(200px, 72vw);
            height: min(200px, 72vw);
        }
        .beacon-btn {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--gray-off);
            background: radial-gradient(circle at 35% 35%, #1a1a1e, var(--dark-bg));
            color: #666;
            font-family: 'VT323', 'JetBrains Mono', monospace;
            font-size: clamp(0.9rem, 3.2vw, 1rem);
            letter-spacing: 2px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.3s;
        }
        .beacon-btn.transmitting {
            border-color: #00ff88;
            color: #00ff88;
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.4);
            animation: blink 1.2s infinite;
        }
        .beacon-btn.connecting {
            border-color: #ffcc00;
            color: #ffcc00;
            animation: blink 0.8s infinite;
        }
        .panic-btn {
            width: 100%;
            max-width: 200px;
            padding: 14px 24px;
            font-family: 'VT323', 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #ff0040;
            background: rgba(255, 0, 64, 0.1);
            border: 2px solid #ff0040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.2);
        }
        .panic-btn:hover {
            background: rgba(255, 0, 64, 0.25);
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.4);
        }
        .panic-btn:active { transform: scale(0.98); }
        .panic-btn.sent {
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }
        @keyframes blink {
            50% { opacity: 0.7; }
        }
        .sentinel-logo { width: 40%; height: auto; margin-bottom: 5px; }
        .beacon-state-text { min-height: 1.5em; text-align: center; font-size: 1.1rem; }
        .beacon-state-text.connected { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
        .beacon-state-text.error { color: #ff4444; }
        .beacon-live {
            width: 100%;
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border: 1px solid rgba(0,242,255,0.2);
            border-radius: 8px;
        }
        .row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 4px; }
        .value { color: var(--neon-cyan); }
        .track-link a { color: #555; text-decoration: none; font-size: 0.8rem; margin-top: 20px; display: block; }
    </style>
</head>
<body>
    <div class="track-wrap">
        <div class="track-title">[ THE BEACON ]</div>
        <div class="beacon-btn-wrap">
            <button type="button" id="beacon-btn" class="beacon-btn">
                <svg class="sentinel-logo" viewBox="0 0 80 80" fill="none" stroke="currentColor">
                    <circle cx="40" cy="40" r="26" stroke-width="2"/>
                    <circle cx="40" cy="40" r="10" fill="currentColor"/>
                </svg>
                <span id="beacon-btn-label">ACTIVAR BALIZA</span>
            </button>
        </div>
        <button type="button" id="panic-btn" class="panic-btn" aria-label="Enviar señal de pánico">PÁNICO</button>
        <div id="beacon-state-text" class="beacon-state-text"></div>
        <div class="beacon-live">
            <div class="row"><span>LATITUD:</span><span id="beacon-lat" class="value">—</span></div>
            <div class="row"><span>LONGITUD:</span><span id="beacon-lng" class="value">—</span></div>
            <div class="row"><span>PRECISIÓN:</span><span id="beacon-precision" class="value">—</span></div>
        </div>
        <div id="beacon-status" style="font-size: 0.7rem; color: #444; margin-top: 10px;"></div>
        <p class="track-link"><a href="dashboard.html">← VOLVER AL WAR ROOM</a></p>
    </div>

    <script>
        (function () {
            // CONFIGURACIÓN SUPABASE
            const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
            
            // CORRECCIÓN AQUÍ: Usar window.supabase para evitar error de referencia
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const btn = document.getElementById('beacon-btn');
            const btnLabel = document.getElementById('beacon-btn-label');
            const stateTextEl = document.getElementById('beacon-state-text');
            const statusEl = document.getElementById('beacon-status');
            const latEl = document.getElementById('beacon-lat');
            const lngEl = document.getElementById('beacon-lng');
            const precisionEl = document.getElementById('beacon-precision');

            let watchId = null;
            let beaconId = 'UNIDAD_MOBILE';

            function setState(msg, type = '') {
                stateTextEl.textContent = msg;
                stateTextEl.className = 'beacon-state-text ' + type;
            }

            async function sendPosition(pos) {
                const { latitude, longitude, accuracy } = pos.coords;
                
                latEl.textContent = latitude.toFixed(6);
                lngEl.textContent = longitude.toFixed(6);
                precisionEl.textContent = Math.round(accuracy) + 'm';

                const { error } = await supabase
                    .from('unidades_live')
                    .upsert({
                        id: beaconId,
                        name: 'Baliza En Vivo',
                        lat: latitude,
                        lng: longitude,
                        status: 'active'
                    }, { onConflict: 'id' });

                if (error) {
                    console.error("Error Supabase:", error);
                    setState("ERROR DE CONEXIÓN", "error");
                    alert("⚠️ ERROR SUPABASE: " + error.message);
                } else {
                    setState("CONECTADO AL RADAR", "connected");
                    statusEl.textContent = "Último pulso: " + new Date().toLocaleTimeString();
                }
            }

            async function sendPanic(pos) {
                const { latitude, longitude, accuracy } = pos.coords;
                latEl.textContent = latitude.toFixed(6);
                lngEl.textContent = longitude.toFixed(6);
                if (precisionEl) precisionEl.textContent = Math.round(accuracy || 0) + 'm';

                const panicBtn = document.getElementById('panic-btn');
                panicBtn.classList.add('sent');
                panicBtn.textContent = 'PÁNICO ENVIADO';
                setTimeout(() => {
                    panicBtn.classList.remove('sent');
                    panicBtn.textContent = 'PÁNICO';
                }, 3000);

                await supabase.from('unidades_live').upsert({
                    id: beaconId,
                    name: 'Baliza En Vivo',
                    lat: latitude,
                    lng: longitude,
                    status: 'panic'
                }, { onConflict: 'id' });

                await supabase.from('incidents_log').insert({
                    latitude: latitude,
                    longitude: longitude,
                    incident_type: 'panic',
                    event_time: new Date().toISOString()
                });

                setState("PÁNICO ENVIADO — WAR ROOM ALERTADO", "connected");
                if (statusEl) statusEl.textContent = "Último pánico: " + new Date().toLocaleTimeString();
            }

            btn.addEventListener('click', () => {
                if (watchId) {
                    navigator.geolocation.clearWatch(watchId);
                    watchId = null;
                    btn.classList.remove('transmitting');
                    btnLabel.textContent = 'ACTIVAR BALIZA';
                    setState("BALIZA APAGADA");
                    return;
                }

                setState("Buscando satélites...", "connecting");
                btn.classList.add('connecting');

                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        btn.classList.remove('connecting');
                        btn.classList.add('transmitting');
                        btnLabel.textContent = 'BALIZA ACTIVA';
                        sendPosition(pos);
                    },
                    (err) => {
                        setState("ERROR GPS: " + err.message, "error");
                        btn.classList.remove('connecting');
                        alert("Por favor, activa el GPS y permite el acceso.");
                    },
                    { enableHighAccuracy: true }
                );
            });

            document.getElementById('panic-btn').addEventListener('click', () => {
                navigator.geolocation.getCurrentPosition(
                    (pos) => sendPanic(pos),
                    (err) => {
                        setState("ERROR GPS: " + err.message, "error");
                        alert("Necesitamos tu ubicación para enviar el pánico. Activa el GPS y permite el acceso.");
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            });
        })();
    </script>
</body>
</html>
