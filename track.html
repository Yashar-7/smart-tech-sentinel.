<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050508">
    <title>Baliza Sentinel — CORE V2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --dark-bg: #050508;
            --gray-off: #2a2a2e;
            --hud-bg: rgba(5, 5, 12, 0.92);
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'VT323', 'JetBrains Mono', monospace;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(0, 242, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 255, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }
        /* Mapa 90% pantalla */
        .map-wrap {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 90vh;
            height: 90dvh;
            z-index: 1;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #0a0a0f;
        }
        .leaflet-tile-pane { filter: contrast(1.1) brightness(0.75) saturate(0.85); }
        .leaflet-control-zoom { border: 1px solid rgba(0, 242, 255, 0.4) !important; }
        .leaflet-control-zoom a { color: var(--neon-cyan) !important; background: var(--hud-bg) !important; }
        .leaflet-control-zoom a:hover { background: rgba(0, 242, 255, 0.15) !important; }

        /* Zona de controles: 10% inferior */
        .controls-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 10vh;
            height: 10dvh;
            min-height: 72px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
        }
        .panic-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .panic-btn {
            padding: 10px 20px;
            font-family: 'VT323', 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: #ff0040;
            background: rgba(255, 0, 64, 0.15);
            border: 2px solid #ff0040;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(255, 0, 64, 0.25);
        }
        .panic-btn:hover {
            background: rgba(255, 0, 64, 0.3);
            box-shadow: 0 0 30px rgba(255, 0, 64, 0.45);
        }
        .panic-btn:active { transform: scale(0.98); }
        .panic-btn.sent {
            color: #00ff88;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
        }
        .btn-detener {
            font-size: 0.75rem;
            letter-spacing: 1px;
            color: var(--neon-cyan);
            background: transparent;
            border: 1px solid rgba(0, 242, 255, 0.5);
            border-radius: 6px;
            padding: 6px 12px;
            cursor: pointer;
            display: none;
        }
        .btn-detener.visible { display: inline-block; }
        .btn-detener:hover { background: rgba(0, 242, 255, 0.1); }

        /* Baliza: círculo estado (cian = inactivo, rojo neón = transmitiendo) */
        .beacon-status-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .beacon-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--gray-off);
            border: 2px solid rgba(0, 242, 255, 0.5);
            transition: all 0.3s;
        }
        .beacon-dot.transmitting {
            background: rgba(255, 0, 64, 0.9);
            border-color: #ff0040;
            box-shadow: 0 0 16px rgba(255, 0, 64, 0.8);
            animation: beacon-pulse 1.2s ease-in-out infinite;
        }
        @keyframes beacon-pulse {
            50% { opacity: 0.85; box-shadow: 0 0 24px rgba(255, 0, 64, 0.9); }
        }
        .beacon-state-label { color: rgba(0, 242, 255, 0.9); }
        .beacon-state-label.transmitting { color: #ff0040; text-shadow: 0 0 10px rgba(255, 0, 64, 0.6); }

        /* HUD overlay minimalista en la base */
        .hud-overlay {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px 8px;
            background: linear-gradient(to top, var(--hud-bg), transparent);
            pointer-events: none;
        }
        .hud-overlay .hud-left, .hud-overlay .hud-right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.7rem;
            color: rgba(0, 242, 255, 0.9);
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.4);
        }
        .hud-overlay .hud-live {
            color: #ff0040;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .hud-overlay .hud-live.active {
            animation: live-blink 1s ease-in-out infinite;
        }
        @keyframes live-blink {
            50% { opacity: 0.5; }
        }
        .track-link {
            position: fixed;
            top: 8px;
            left: 8px;
            z-index: 15;
            pointer-events: auto;
        }
        .track-link a {
            color: rgba(0, 242, 255, 0.7);
            text-decoration: none;
            font-size: 0.75rem;
        }
        .leaflet-control-attribution { display: none !important; }
    </style>
</head>
<body>
    <p class="track-link"><a href="dashboard.html">← WAR ROOM</a></p>
    <div class="map-wrap">
        <div id="map"></div>
    </div>
    <div class="hud-overlay">
        <div class="hud-left">
            <span id="hud-battery">BAT —</span>
            <span id="hud-signal">SIG —</span>
        </div>
        <div class="hud-right">
            <span class="hud-live" id="hud-live">LIVE</span>
        </div>
    </div>
    <div class="controls-wrap">
        <div class="beacon-status-wrap">
            <span class="beacon-dot" id="beacon-dot" aria-hidden="true"></span>
            <span class="beacon-state-label" id="beacon-state-label">BALIZA DESACTIVADA</span>
        </div>
        <div class="panic-row">
            <button type="button" id="panic-btn" class="panic-btn" aria-label="Pánico One-Touch">¡PÁNICO!</button>
            <button type="button" id="btn-detener" class="btn-detener" aria-label="Detener emergencia">DETENER EMERGENCIA</button>
        </div>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = 'https://svpurpvbiujhcbiugrkh.supabase.co';
            const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2cHVycHZiaXVqaGNiaXVncmtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc3NDgzMTUsImV4cCI6MjA4MzMyNDMxNX0.AivKJ0_N0z_4T4vLNfUcE2hepJ1XXOO8-4fSA3PJXdc';
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

            const BEACON_ID = 'UNIDAD_MOBILE';
            const WAR_ROOM_PEER_ID = 'CENTRAL_COMMAND_MDQ';

            var currentUserId = null;

            let mobilePeer = null;
            let mobileCall = null;
            let mobileStream = null;
            let panicRetryTimer = null;

            const mapEl = document.getElementById('map');
            const panicBtn = document.getElementById('panic-btn');
            const btnDetener = document.getElementById('btn-detener');
            const hudLive = document.getElementById('hud-live');
            const hudBattery = document.getElementById('hud-battery');
            const hudSignal = document.getElementById('hud-signal');
            const beaconDot = document.getElementById('beacon-dot');
            const beaconStateLabel = document.getElementById('beacon-state-label');

            // ——— Mapa táctico Dark Mode HUD ———
            const map = L.map('map', { zoomControl: false }).setView([-37.994, -57.553], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: '',
                maxZoom: 19
            }).addTo(map);
            try { if (map.attributionControl) map.removeControl(map.attributionControl); } catch (e) {}
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            const selfMarker = L.circleMarker([-37.994, -57.553], {
                radius: 10,
                fillColor: '#00f2ff',
                color: '#00f2ff',
                weight: 2,
                fillOpacity: 0.9
            }).addTo(map);

            function updateSelfMarker(lat, lng) {
                selfMarker.setLatLng([lat, lng]);
                map.setView([lat, lng], map.getZoom(), { animate: true });
            }

            // ——— Telemetría HUD ———
            function updateHudTelemetry() {
                if (navigator.getBattery) {
                    navigator.getBattery().then(function (b) {
                        var pct = Math.round(b.level * 100);
                        hudBattery.textContent = 'BAT ' + pct + '%';
                    }).catch(function () { hudBattery.textContent = 'BAT —'; });
                } else { hudBattery.textContent = 'BAT —'; }
                var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn && conn.effectiveType) {
                    hudSignal.textContent = 'SIG ' + (conn.effectiveType || '—').toUpperCase();
                } else { hudSignal.textContent = 'SIG —'; }
            }
            setInterval(updateHudTelemetry, 5000);
            updateHudTelemetry();

            function getUnitId() { return currentUserId || BEACON_ID; }

            var locationWatchId = null;
            supabase.auth.getSession().then(function (r) {
                var session = r.data && r.data.session;
                if (session && session.user) currentUserId = session.user.id;
                supabase.auth.onAuthStateChange(function (event, session) {
                    currentUserId = (session && session.user) ? session.user.id : null;
                    if (currentUserId && navigator.geolocation && !locationWatchId) startLocationWatch();
                    if (!currentUserId && locationWatchId) {
                        navigator.geolocation.clearWatch(locationWatchId);
                        locationWatchId = null;
                    }
                });
                if (currentUserId && navigator.geolocation) startLocationWatch();
            });
            function startLocationWatch() {
                if (locationWatchId || !currentUserId) return;
                locationWatchId = navigator.geolocation.watchPosition(
                    function (pos) {
                        if (currentUserId) sendLocationToSupabase(pos).then(function (res) {
                            if (res.error) console.warn('locations:', res.error.message);
                        });
                    },
                    function () {},
                    { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
                );
            }

            function sendLocationToSupabase(pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
                var payload = {
                    latitude: lat,
                    longitude: lng,
                    updated_at: new Date().toISOString()
                };
                if (acc != null) payload.accuracy = acc;
                if (currentUserId) {
                    payload.user_id = currentUserId;
                    return supabase.from('locations').upsert(payload, { onConflict: 'user_id' });
                }
                return Promise.resolve({ data: null, error: null });
            }

            function setLiveIndicator(active) {
                if (active) hudLive.classList.add('active'); else hudLive.classList.remove('active');
            }

            // Estado de la baliza: TRANSMITIENDO (rojo) o BALIZA DESACTIVADA
            function setBeaconState(transmitting) {
                if (beaconDot) {
                    if (transmitting) {
                        beaconDot.classList.add('transmitting');
                    } else {
                        beaconDot.classList.remove('transmitting');
                    }
                }
                if (beaconStateLabel) {
                    beaconStateLabel.textContent = transmitting ? 'TRANSMITIENDO' : 'BALIZA DESACTIVADA';
                    if (transmitting) beaconStateLabel.classList.add('transmitting');
                    else beaconStateLabel.classList.remove('transmitting');
                }
            }

            // ——— Envío de coordenadas, locations (user_id real) y alerta War Room ———
            function sendPanicToSupabase(pos) {
                var lat = pos.coords.latitude, lng = pos.coords.longitude, acc = pos.coords.accuracy;
                var unitId = getUnitId();
                var promises = [
                    supabase.from('unidades_live').upsert({
                        id: unitId,
                        name: 'Baliza En Vivo',
                        lat: lat,
                        lng: lng,
                        status: 'panic'
                    }, { onConflict: 'id' }),
                    supabase.from('incidents_log').insert({
                        latitude: lat,
                        longitude: lng,
                        incident_type: 'panic',
                        event_time: new Date().toISOString()
                    }),
                    sendLocationToSupabase(pos)
                ];
                return Promise.all(promises).then(function () {
                    updateSelfMarker(lat, lng);
                });
            }

            // ——— Streaming a War Room: ID = Supabase Auth user_id (estable, no cambia al refrescar) ———
            var RECONNECT_INTERVAL_MS = 3000;
            function startStreamToWarRoom(stream) {
                if (typeof Peer === 'undefined') {
                    console.warn('PeerJS no cargado — stream no enviado');
                    return;
                }
                var streamId = getUnitId();
                if (!stream || !stream.active) {
                    console.warn('Stream inactivo o perdido');
                    return;
                }
                window._sentinelPanicStream = stream;
                console.log('Stream iniciado con ID:', streamId);
                function tryCall() {
                    if (!window._sentinelPanicStream || !window._sentinelPanicStream.active) return;
                    var currentStream = window._sentinelPanicStream;
                    try {
                        if (mobileCall) { try { mobileCall.close(); } catch (e) {} mobileCall = null; }
                        if (mobilePeer) { try { mobilePeer.destroy(); } catch (e) {} mobilePeer = null; }
                        mobilePeer = new Peer(streamId);
                        mobilePeer.on('open', function () {
                            mobileCall = mobilePeer.call(WAR_ROOM_PEER_ID, currentStream);
                            if (mobileCall) {
                                mobileCall.on('stream', function () {
                                    if (panicRetryTimer) { clearInterval(panicRetryTimer); panicRetryTimer = null; }
                                    setLiveIndicator(true);
                                    btnDetener.classList.add('visible');
                                    console.log('Video enviado al War Room con ID:', streamId);
                                });
                                mobileCall.on('close', function () {
                                    setLiveIndicator(false);
                                    if (currentStream && currentStream.active) {
                                        if (panicRetryTimer) clearInterval(panicRetryTimer);
                                        panicRetryTimer = setInterval(tryCall, RECONNECT_INTERVAL_MS);
                                    }
                                });
                                mobileCall.on('error', function () {
                                    if (currentStream && currentStream.active) {
                                        if (panicRetryTimer) clearInterval(panicRetryTimer);
                                        panicRetryTimer = setInterval(tryCall, RECONNECT_INTERVAL_MS);
                                    }
                                });
                            }
                        });
                        mobilePeer.on('error', function (err) {
                            console.warn('PeerJS error:', err && (err.type || err.message));
                            if (currentStream && currentStream.active) {
                                if (panicRetryTimer) clearInterval(panicRetryTimer);
                                panicRetryTimer = setInterval(tryCall, RECONNECT_INTERVAL_MS);
                            }
                        });
                    } catch (e) {
                        console.warn('startStreamToWarRoom catch:', e);
                        if (currentStream && currentStream.active) {
                            if (panicRetryTimer) clearInterval(panicRetryTimer);
                            panicRetryTimer = setInterval(tryCall, RECONNECT_INTERVAL_MS);
                        }
                    }
                }
                tryCall();
            }

            // ——— Captura robusta: video+audio; si falla, solo video ———
            function getCameraStream() {
                return navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .catch(function () {
                        return navigator.mediaDevices.getUserMedia({ video: true });
                    });
            }

            // ——— startPanic: permiso de cámara INMEDIATAMENTE al presionar; mismo ID que GPS (BEACON_ID) ———
            function startPanic() {
                setBeaconState(true);
                panicBtn.classList.add('sent');
                panicBtn.textContent = 'ENVIANDO…';

                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    panicBtn.textContent = '¡PÁNICO!';
                    panicBtn.classList.remove('sent');
                    setBeaconState(false);
                    alert('Cámara no disponible en este dispositivo.');
                    return;
                }

                var streamDone = false;
                var posDone = false;
                function maybeFinish() {
                    if (streamDone && posDone) {
                        panicBtn.textContent = 'PÁNICO ENVIADO';
                        setTimeout(function () {
                            panicBtn.classList.remove('sent');
                            panicBtn.textContent = '¡PÁNICO!';
                        }, 3000);
                    }
                }

                getCameraStream()
                    .then(function (stream) {
                        mobileStream = stream;
                        window._sentinelPanicStream = stream;
                        console.log('Stream iniciado con ID (Supabase Auth user_id):', getUnitId());
                        startStreamToWarRoom(stream);
                        streamDone = true;
                        maybeFinish();
                    })
                    .catch(function (err) {
                        console.warn('getUserMedia error:', err);
                        streamDone = true;
                        maybeFinish();
                        alert('Se necesita permiso de cámara para enviar video al War Room.');
                    });

                navigator.geolocation.getCurrentPosition(
                    function (pos) {
                        sendPanicToSupabase(pos).then(function () {
                            posDone = true;
                            maybeFinish();
                        });
                    },
                    function (err) {
                        panicBtn.textContent = '¡PÁNICO!';
                        panicBtn.classList.remove('sent');
                        setBeaconState(false);
                        alert('Necesitamos ubicación. Activa GPS y permite acceso.');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }

            panicBtn.addEventListener('click', function () {
                if (location.protocol !== 'https:' && !/^localhost$|^127\.0\.0\.1$/i.test(location.hostname)) {
                    alert('La cámara requiere HTTPS.');
                    return;
                }
                startPanic();
            });

            // ——— Control de zombies: desconectar y limpiar slot al cerrar o detener ———
            function cleanupCameraAndNotify() {
                setBeaconState(false);
                setLiveIndicator(false);
                btnDetener.classList.remove('visible');
                if (panicRetryTimer) { clearInterval(panicRetryTimer); panicRetryTimer = null; }
                if (mobileStream) {
                    mobileStream.getTracks().forEach(function (t) { t.stop(); });
                    mobileStream = null;
                }
                window._sentinelPanicStream = null;
                if (mobileCall) { try { mobileCall.close(); } catch (e) {} mobileCall = null; }
                if (mobilePeer) { try { mobilePeer.destroy(); } catch (e) {} mobilePeer = null; }
                supabase.from('unidades_live').upsert({
                    id: getUnitId(),
                    name: 'Baliza En Vivo',
                    lat: null,
                    lng: null,
                    status: 'offline'
                }, { onConflict: 'id' }).then(function () {});
            }

            btnDetener.addEventListener('click', function () {
                cleanupCameraAndNotify();
            });

            window.addEventListener('beforeunload', cleanupCameraAndNotify);
            window.addEventListener('pagehide', cleanupCameraAndNotify);
            window.addEventListener('unload', cleanupCameraAndNotify);
        })();
    </script>
</body>
</html>
